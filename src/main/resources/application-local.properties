# ----------------------------------------------------
# Lumière - Local Testing Profile Configuration
# Active by running: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ----------------------------------------------------

# Port & Server Settings
server.port=8080
server.address=127.0.0.1

# ----------------------------------------------------
# DATABASE CONFIGURATION
# ----------------------------------------------------
# Choose Option 1 (Use your live Render Database externally) or Option 2 (Local Database)

# Option 1: Live Render External Database (Recommended - Keeps all products & data intact!)
spring.datasource.url=jdbc:postgresql://<RENDER_EXTERNAL_DB_HOST>:5432/<DB_NAME>?sslmode=require
spring.datasource.username=<RENDER_DB_USER>
spring.datasource.password=<RENDER_DB_PASSWORD>

# Option 2: Local PostgreSQL Database (Alternative)
# spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
# spring.datasource.username=postgres
# spring.datasource.password=your_local_postgres_password

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ----------------------------------------------------
# API CREDENTIALS (Paste your keys below for local testing)
# ----------------------------------------------------
cloudinary.cloud-name=your_cloudinary_cloud_name
cloudinary.api-key=your_cloudinary_api_key
cloudinary.api-secret=your_cloudinary_api_secret

razorpay.key-id=your_razorpay_key_id
razorpay.key-secret=your_razorpay_key_secret

# Google OAuth2 Credentials for Login with Google
spring.security.oauth2.client.registration.google.client-id=your_google_client_id
spring.security.oauth2.client.registration.google.client-secret=your_google_client_secret
spring.security.oauth2.client.registration.google.scope=profile,email

# Admin Email Whitelist
app.admin.emails=asmitabiswas220@gmail.com,admin@store.com
