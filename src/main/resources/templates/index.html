<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière - Premium Handmade Curations</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #d4af37; /* Gold */
            --accent-hover: #b5952f;
            --card-bg: rgba(255, 255, 255, 0.8);
            --border: rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(250, 250, 250, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover { color: var(--text-main); }

        .btn-auth {
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-auth:hover {
            background: var(--text-main);
            color: white;
        }

        /* Hero */
        .hero {
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #111;
        }

        .hero img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            max-width: 800px;
            padding: 0 20px;
        }

        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 600;
            margin-bottom: 1rem;
            animation: fadeUp 1s ease-out;
        }

        .hero-content p {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
            animation: fadeUp 1s ease-out 0.2s both;
        }

        /* Products Grid */
        .section-container {
            padding: 5rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
        }

        .card-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 1.5rem;
            background: white;
            position: relative;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-add {
            width: 100%;
            padding: 0.8rem;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-add:hover { background: #333; }
        
        .btn-delete {
            width: 100%;
            padding: 0.8rem;
            background: #fff;
            color: #ef4444;
            border: 1px solid #fee2e2;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .btn-delete:hover {
            background: #fef2f2;
            border-color: #ef4444;
        }

        /* Footer */
        .footer {
            background: var(--text-main);
            color: white;
            padding: 3rem 5%;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">Lumière</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/cart">Cart</a>
            <a href="/admin">Admin Dashboard</a>
            
            <th:block th:if="${session.loggedInUser == null}">
                <a href="/login" class="btn-auth">Sign In</a>
                <a href="/register" class="btn-auth" style="background:var(--text-main);color:white;">Register</a>
            </th:block>
            
            <th:block th:unless="${session.loggedInUser == null}">
                <span style="color:var(--text-main); font-weight:600;">Welcome, <span th:text="${session.loggedInUser.name}"></span></span>
                <a href="/logout" class="btn-auth">Sign Out</a>
            </th:block>
        </div>
    </nav>

    <header class="hero">
        <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=2070&auto=format&fit=crop" alt="Hero">
        <div class="hero-content">
            <h1>Curated Elegance</h1>
            <p>Discover a collection of exceptionally crafted, bespoke items for your modern lifestyle.</p>
        </div>
    </header>

    <main class="section-container">
        <h2 class="section-title">The Collection</h2>
        <div class="grid">
            <div class="card" th:each="product : ${products}">
                <div style="overflow: hidden;">
                    <img th:src="${product.imageUrl}" alt="Product Image" class="card-img">
                </div>
                <div class="card-body">
                    <h3 class="card-title" th:text="${product.name}"></h3>
                    <p class="card-desc" th:text="${product.description}"></p>
                    <div class="price-row">
                        <span class="price" th:text="'₹' + ${product.price}"></span>
                        <span style="color:#fbbf24; font-size:1.1rem;">★★★★☆</span>
                    </div>
                    <form th:action="@{/add-to-cart/{id}(id=${product.id})}" method="get">
                        <button type="submit" class="btn-add">Add to Cart</button>
                    </form>
                    <form th:action="@{/delete-product/{id}(id=${product.id})}" method="get">
                        <button type="submit" class="btn-delete">Remove Item</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Lumière Curations. Crafted with elegance.</p>
    </footer>

</body>
</html>
