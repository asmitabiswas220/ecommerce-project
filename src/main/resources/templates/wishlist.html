<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière – My Wishlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafafa;
            --text-main: #1a1a1a;
            --text-muted: #666;
            --accent: #d4af37;
            --border: rgba(0,0,0,0.07);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-lg: 0 20px 50px -10px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh;
               background-image: radial-gradient(circle at top right, #fce7f3, transparent 40%); }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.4rem 6%; background: rgba(250,250,250,0.85);
            backdrop-filter: blur(14px); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--text-main); text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 0.95rem; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text-main); }
        .nav-badge {
            background: #ef4444; color: white; font-size: 0.68rem; font-weight: 700;
            border-radius: 50%; min-width: 17px; height: 17px; display: inline-flex;
            align-items: center; justify-content: center; margin-left: 4px;
        }
        .wish-badge {
            background: #f43f5e; color: white; font-size: 0.68rem; font-weight: 700;
            border-radius: 50%; min-width: 17px; height: 17px; display: inline-flex;
            align-items: center; justify-content: center; margin-left: 4px;
        }
        .btn-auth { padding: 0.55rem 1.2rem; border-radius: 50px; border: 1px solid var(--text-main); font-weight: 500; transition: all 0.2s; }
        .btn-auth:hover { background: var(--text-main); color: white; }

        /* Page header */
        .page-header {
            padding: 4rem 6% 2.5rem;
            max-width: 1200px; margin: 0 auto;
        }
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem; margin-bottom: 0.5rem;
        }
        .page-header p { color: var(--text-muted); font-size: 1rem; }

        /* Grid */
        .grid-container { max-width: 1200px; margin: 0 auto; padding: 0 6% 5rem; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Card */
        .card {
            background: white; border: 1px solid var(--border);
            border-radius: 18px; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
        .card-img-wrap { overflow: hidden; position: relative; }
        .card-img { width: 100%; height: 260px; object-fit: cover; display: block; transition: transform 0.5s ease; }
        .card:hover .card-img { transform: scale(1.06); }
        .card-body { padding: 1.4rem; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
        .card-desc {
            color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.2rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .price { font-size: 1.3rem; font-weight: 700; }
        .stars { color: #fbbf24; }

        .btn-row { display: flex; gap: 0.6rem; }
        .btn-cart {
            flex: 1; padding: 0.75rem; background: var(--text-main); color: white;
            border: none; border-radius: 10px; font-family: 'Inter', sans-serif;
            font-weight: 600; font-size: 0.9rem; cursor: pointer;
            transition: all 0.25s ease; text-decoration: none;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-cart:hover { background: #333; transform: translateY(-1px); }
        .btn-remove {
            padding: 0.75rem 1rem; background: white; color: #f43f5e;
            border: 1.5px solid #fecdd3; border-radius: 10px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem;
            cursor: pointer; transition: all 0.25s ease; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-remove:hover { background: #fff1f2; border-color: #f43f5e; }

        /* Empty state */
        .empty-state {
            text-align: center; padding: 6rem 2rem;
            background: white; border-radius: 24px; border: 1px dashed rgba(0,0,0,0.1);
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 1.5rem; }
        .empty-state h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 0.8rem; }
        .empty-state p { color: var(--text-muted); margin-bottom: 2rem; }
        .btn-browse {
            display: inline-block; padding: 0.9rem 2rem;
            background: var(--text-main); color: white;
            border-radius: 50px; text-decoration: none;
            font-weight: 600; transition: all 0.25s;
        }
        .btn-browse:hover { background: #333; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">Lumière</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/wishlist" style="color:var(--text-main);">❤ Wishlist
                <span class="wish-badge" th:if="${wishlistCount > 0}" th:text="${wishlistCount}"></span>
            </a>
            <a href="/cart">🛒 Cart <span class="nav-badge" th:if="${cartCount > 0}" th:text="${cartCount}"></span></a>
            <a href="/admin" th:if="${isAdmin}">Admin</a>
            <th:block th:if="${session.loggedInUser == null}">
                <a href="/login" class="btn-auth">Sign In</a>
            </th:block>
            <th:block th:unless="${session.loggedInUser == null}">
                <a href="/orders">My Orders</a>
                <a href="/profile">My Profile</a>
                <a href="/logout" class="btn-auth">Sign Out</a>
            </th:block>
        </div>
    </nav>

    <div class="page-header">
        <h1>❤ My Wishlist</h1>
        <p th:if="${!#lists.isEmpty(wishlistItems)}"
           th:text="${#lists.size(wishlistItems)} + ' saved item(s)'">Saved items</p>
    </div>

    <div class="grid-container">

        <!-- Empty State -->
        <div class="empty-state" th:if="${#lists.isEmpty(wishlistItems)}">
            <div class="icon">🤍</div>
            <h2>Your wishlist is empty</h2>
            <p>Browse our curated collection and save items you love.</p>
            <a href="/" class="btn-browse">Explore Collection</a>
        </div>

        <!-- Product Grid -->
        <div class="products-grid" th:unless="${#lists.isEmpty(wishlistItems)}">
            <div class="card" th:each="product : ${wishlistItems}">
                <a th:href="@{/product/{id}(id=${product.id})}" class="card-img-wrap">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}" class="card-img">
                </a>
                <div class="card-body">
                    <h3 class="card-title" th:text="${product.name}">Name</h3>
                    <p class="card-desc" th:text="${product.description}">Description</p>
                    <div class="price-row">
                        <span class="price" th:text="'₹' + ${product.price}">₹0</span>
                        <span class="stars">★★★★☆</span>
                    </div>
                    <div class="btn-row">
                        <a th:href="@{/add-to-cart/{id}(id=${product.id})}" class="btn-cart">🛒 Add to Cart</a>
                        <a th:href="@{/wishlist/remove/{id}(id=${product.id}, redirect='/wishlist')}" class="btn-remove">♥</a>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
