<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière - My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent-gold: #c5a880;
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at top left, #fef3c7, transparent), radial-gradient(circle at bottom right, #f3e8ff, transparent);
            padding-bottom: 5rem;
        }

        /* 1. Header Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 8%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.2rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .btn-auth {
            padding: 0.6rem 1.4rem;
            border-radius: 50px;
            border: 1px solid var(--text-main);
            color: var(--text-main) !important;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-auth:hover {
            background: var(--text-main);
            color: white !important;
        }

        /* 2. Main Dashboard Layout */
        .container {
            max-width: 900px;
            margin: 4rem auto 0;
            padding: 0 2rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2.5rem;
            margin-top: 2rem;
        }

        /* Left Avatar Card */
        .profile-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-md);
            height: fit-content;
        }

        .avatar-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fef3c7, #f3e8ff);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 600;
            color: var(--text-main);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05), var(--shadow-sm);
            border: 3px solid white;
        }

        .profile-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .profile-role {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-gold);
            background: rgba(197, 168, 128, 0.12);
            padding: 0.3rem 1rem;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        /* Right Form Panel */
        .details-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: var(--shadow-md);
        }

        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .success-banner {
            background: #ecfdf5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .info-field {
            width: 100%;
            padding: 1rem 1.2rem;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .info-field:focus {
            outline: none;
            background: white;
            border-color: var(--text-main);
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
        }

        .btn-submit {
            padding: 1.1rem 2rem;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: var(--shadow-sm);
        }

        .btn-submit:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .navbar {
                padding: 1rem 5%;
            }
            .nav-links {
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Header Navigation Bar -->
    <nav class="navbar">
        <a href="/" class="logo">Lumière</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/cart" style="display: inline-flex; align-items: center; gap: 8px; position: relative;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                Cart
                <span th:if="${cartCount > 0}" th:text="${cartCount}" style="
                    background: #ef4444;
                    color: white;
                    font-size: 0.72rem;
                    font-weight: 700;
                    border-radius: 50%;
                    min-width: 18px;
                    height: 18px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    position: absolute;
                    top: -8px;
                    right: -12px;
                    padding: 0 4px;
                    box-shadow: 0 2px 4px rgba(239, 68, 68, 0.4);
                ">0</span>
            </a>
            <a href="/orders">My Orders</a>
            <a href="/admin" th:if="${isAdmin}">Admin Dashboard</a>

            <th:block th:unless="${session.loggedInUser == null}">
                <a href="/profile" style="font-weight: 700; color: var(--text-main); text-decoration: underline;">My Profile</a>
                <a href="/logout" class="btn-auth">Sign Out</a>
            </th:block>
        </div>
    </nav>

    <!-- 2. Main Dashboard -->
    <div class="container">
        <div class="dashboard-grid">
            
            <!-- Left Profile Card -->
            <div class="profile-card">
                <div class="avatar-circle" th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">U</div>
                <h2 class="profile-name" th:text="${user.name}">User Name</h2>
                <span class="profile-role" th:text="${isAdmin ? 'Administrator' : 'Customer'}">Customer</span>
                
                <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-top: 1rem;">
                    Registered member of Lumière. Enjoy your secure and curated shopping journey.
                </p>
            </div>

            <!-- Right Details Editor Form -->
            <div class="details-panel">
                <h2 class="panel-title">Account Details</h2>

                <!-- Dynamic Success Notification -->
                <div th:if="${param.success}" class="success-banner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Profile updated successfully!
                </div>

                <form th:action="@{/profile/update}" method="post">
                    
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="name" th:value="${user.name}" class="info-field" placeholder="Your Full Name" required>
                    </div>

                    <div class="form-group">
                        <label>Username / Email</label>
                        <input type="text" name="username" th:value="${user.username}" class="info-field" placeholder="name@domain.com" required>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number (For Secure OTP Login)</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <span style="background: rgba(0,0,0,0.03); border: 1px solid var(--border); padding: 1rem 1.2rem; border-radius: 12px; font-weight: 600; font-size: 1rem; color: var(--text-muted);">+91</span>
                            <input type="tel" name="phoneNumber" th:value="${user.phoneNumber}" class="info-field" placeholder="9876543210" style="flex-grow: 1;">
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Save Changes</button>
                </form>
            </div>

        </div>
    </div>

</body>
</html>
