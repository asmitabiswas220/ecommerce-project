<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière - Your Cart</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: white;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .btn-auth {
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-auth:hover {
            background: var(--text-main);
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: 4rem auto;
            padding: 0 20px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .cart-grid {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            padding: 2rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            gap: 2rem;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cart-details {
            flex-grow: 1;
        }

        .cart-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .cart-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-remove {
            padding: 0.6rem 1.2rem;
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fee2e2;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-remove:hover {
            background: #fee2e2;
        }

        .checkout-bar {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 2rem;
        }

        .btn-checkout {
            padding: 1rem 2rem;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            padding: 4rem 0;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="/" class="logo">Lumière</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/cart">Cart</a>
            <a href="/admin">Admin Dashboard</a>

            <th:block th:if="${session.loggedInUser == null}">
                <a href="/login" class="btn-auth">Sign In</a>
                <a href="/register" class="btn-auth" style="background:var(--text-main);color:white;">Register</a>
            </th:block>

            <th:block th:unless="${session.loggedInUser == null}">
                <a href="/orders">My Orders</a>
                <span style="color:var(--text-main); font-weight:600;">Welcome, <span
                        th:text="${session.loggedInUser.name}"></span></span>
                <a href="/logout" class="btn-auth">Sign Out</a>
            </th:block>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Your Shopping Cart</h1>

        <div class="cart-grid">
            <div th:if="${cartItems.empty}" class="empty-cart">
                Your cart is currently empty.
                <br><br>
                <a href="/" style="color:var(--text-main); text-decoration:underline;">Continue Shopping</a>
            </div>

            <div class="cart-item" th:each="item : ${cartItems}">
                <img th:src="${item.imageUrl}" alt="Item" class="cart-img">
                <div class="cart-details">
                    <h3 class="cart-title" th:text="${item.name}"></h3>
                    <p style="color: var(--text-muted); margin-bottom: 0.5rem;" th:text="${item.description}"></p>
                    <div class="cart-price" th:text="'₹' + ${item.price}"></div>
                </div>
                <form th:action="@{/remove-from-cart/{id}(id=${item.id})}" method="get">
                    <button type="submit" class="btn-remove">Remove</button>
                </form>
            </div>

            <div class="checkout-bar" th:unless="${cartItems.empty}">
                <button class="btn-checkout" onclick="checkout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script th:inline="javascript">
        function checkout() {

            fetch("/checkout/create-order", {
                method: "POST"
            })
                .then(res => res.json())
                .then(order => {

                    var options = {
                        "key": [[${razorpayKeyId}]],
                        "amount": order.amount,
                        "currency": "INR",
                        "name": "Lumière Store",
                        "description": "Handmade Products Checkout",
                        "order_id": order.id,

                        "handler": function (response) {

                            fetch("/checkout/confirm", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify(response)
                            })
                                .then(() => {
                                    alert("Payment Successful!");
                                    window.location.href = "/";
                                });

                        }
                    };

                    var rzp = new Razorpay(options);
                    rzp.open();
                });
        }
    </script>
</body>

</html>
