# ----------------------------------------------------
# Lumière - Local Testing Profile Configuration
# Active by running: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ----------------------------------------------------

# Port & Server Settings
server.port=8080
server.address=127.0.0.1

# ----------------------------------------------------
# DATABASE CONFIGURATION
# ----------------------------------------------------
# Configured to use a self-contained in-memory H2 database (starts instantly, no setup needed!)
spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ----------------------------------------------------
# API CREDENTIALS (Pre-configured placeholders for local testing)
# ----------------------------------------------------
cloudinary.cloud-name=mock_cloudinary
cloudinary.api-key=1234567890
cloudinary.api-secret=mock_secret

razorpay.key-id=rzp_test_mock
razorpay.key-secret=mock_secret

# Google OAuth2 Credentials (Mock keys to ensure successful spring boot startup)
spring.security.oauth2.client.registration.google.client-id=987654321-mockgoogleid.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=GOCSPX-mocksecret12345678
spring.security.oauth2.client.registration.google.scope=profile,email

# Admin Email Whitelist
app.admin.emails=asmitabiswas220@gmail.com,admin@store.com
