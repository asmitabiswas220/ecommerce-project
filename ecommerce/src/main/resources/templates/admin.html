<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            background-image: radial-gradient(circle at top right, #f3e8ff, transparent), radial-gradient(circle at bottom left, #e0e7ff, transparent);
        }

        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
        }

        .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 500; transition: color 0.3s ease; }
        .nav-links a:hover { color: var(--text-main); }

        .btn-auth {
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn-auth:hover {
            background: var(--text-main);
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            max-width: 600px;
            width: 100%;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--text-main);
            background: white;
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 1.2rem;
            border: none;
            background: var(--text-main);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            background: #333;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">Lumière</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/cart">Cart</a>
            <a href="/admin">Admin Dashboard</a>
            
            <th:block th:if="${session.loggedInUser == null}">
                <a href="/login" class="btn-auth">Sign In</a>
                <a href="/register" class="btn-auth" style="background:var(--text-main);color:white;">Register</a>
            </th:block>
            
            <th:block th:unless="${session.loggedInUser == null}">
                <span style="color:var(--text-main); font-weight:600;">Welcome, <span th:text="${session.loggedInUser.name}"></span></span>
                <a href="/logout" class="btn-auth">Sign Out</a>
            </th:block>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Add New Product</h1>

        <form action="/add-product" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" placeholder="E.g., Artisan Ceramic Vase" required>
            </div>

            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" placeholder="0.00" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Product Image</label>
                <input type="file" name="image" accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="Describe the details and craftsmanship of the product..." required></textarea>
            </div>

            <button type="submit">Publish Product</button>
        </form>
    </div>

</body>
</html>
