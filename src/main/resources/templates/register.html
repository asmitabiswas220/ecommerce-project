<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumiere - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f7f4;
            --surface: rgba(255, 255, 255, 0.92);
            --ink: #171717;
            --muted: #666b70;
            --line: rgba(23, 23, 23, 0.12);
            --green: #0d7c66;
            --rose: #d92d55;
            --shadow: 0 18px 48px rgba(24, 30, 27, 0.12);
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background:
                linear-gradient(90deg, rgba(247,247,244,0.96), rgba(247,247,244,0.72)),
                url('https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=2070&auto=format&fit=crop') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 1rem 2rem;
        }

        a { color: inherit; text-decoration: none; }

        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .nav-link {
            color: var(--muted);
            font-weight: 800;
            font-size: 0.92rem;
        }

        .auth-card {
            width: min(460px, 100%);
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.35rem;
            backdrop-filter: blur(18px);
        }

        .eyebrow {
            color: var(--green);
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.55rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.7rem;
            line-height: 1;
            margin-bottom: 0.7rem;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 1.4rem;
        }

        .alert {
            background: #fff1f3;
            color: var(--rose);
            border: 1px solid #ffd2dc;
            border-radius: var(--radius);
            padding: 0.8rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .field { margin-bottom: 0.85rem; }
        label {
            display: block;
            margin-bottom: 0.35rem;
            color: #383d41;
            font-size: 0.86rem;
            font-weight: 900;
        }

        input {
            width: 100%;
            min-height: 46px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: white;
            padding: 0 0.9rem;
            outline: none;
        }

        input:focus { border-color: rgba(23, 23, 23, 0.45); }

        .submit-btn {
            width: 100%;
            min-height: 48px;
            border-radius: var(--radius);
            border: 1px solid var(--ink);
            background: var(--ink);
            color: white;
            font-weight: 900;
            cursor: pointer;
            margin-top: 0.35rem;
        }

        .switch {
            color: var(--muted);
            text-align: center;
            font-size: 0.92rem;
            margin-top: 1.1rem;
        }

        .switch a {
            color: var(--ink);
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">Lumiere</a>
        <a href="/" class="nav-link">Back to shop</a>
    </nav>

    <main class="auth-card">
        <div class="eyebrow">Join Lumiere</div>
        <h1>Create account</h1>
        <p class="subtitle">Save your wishlist, track orders, and checkout faster.</p>

        <div class="alert" th:if="${registerError}" th:text="${registerError}">Registration error</div>

        <form action="/register" method="post" th:object="${user}">
            <div class="field">
                <label for="name">Full name</label>
                <input id="name" th:field="*{name}" type="text" placeholder="Your name" required autocomplete="name">
            </div>
            <div class="field">
                <label for="username">Email</label>
                <input id="username" th:field="*{username}" type="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="field">
                <label for="phoneNumber">Phone number</label>
                <input id="phoneNumber" th:field="*{phoneNumber}" type="tel" placeholder="Optional" autocomplete="tel">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" th:field="*{password}" type="password" placeholder="Create a password" required autocomplete="new-password">
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat password" required autocomplete="new-password">
            </div>
            <button class="submit-btn" type="submit">Create Account</button>
        </form>

        <p class="switch">Already have an account? <a href="/login">Sign in</a></p>
    </main>
</body>
</html>
