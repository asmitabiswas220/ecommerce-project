<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière - Secure Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border: rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top left, #fef3c7, transparent), radial-gradient(circle at bottom right, #f3e8ff, transparent);
        }

        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            max-width: 440px;
            width: 100%;
            padding: 3.5rem 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.4);
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            margin-bottom: 0.6rem;
            color: var(--text-main);
        }
        
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 1.2rem;
            background: white;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 14px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .btn-google:hover {
            background-color: #f7f7f7 !important;
            border-color: rgba(0,0,0,0.15) !important;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(0,0,0,0.1) !important;
        }

        .btn-bypass {
            display: inline-block;
            width: 100%;
            padding: 1rem;
            background: rgba(59, 130, 246, 0.05);
            border: 1px dashed rgba(59, 130, 246, 0.3);
            border-radius: 14px;
            color: #2563eb;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 1.5rem;
        }

        .btn-bypass:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.15);
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">Lumière</a>
    </nav>

    <div class="container">
        <h1 class="page-title">Curated Access</h1>
        <p class="subtitle">A secure boutique experience. Sign in using your Google account to access your personalized profile, shopping cart, and order history.</p>

        <!-- Pure Google Login Button -->
        <a href="/oauth2/authorization/google" class="btn-google">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" style="width:22px;height:22px;">
            Continue with Google
        </a>

        <!-- Local Dev Auto-Login (Bypasses keys on localhost) -->
        <a href="/auth/local-bypass" class="btn-bypass">
            ⚡ Local Dev Auto-Login (Admin Bypass)
        </a>
    </div>

</body>
</html>
