<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border: rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top left, #fef3c7, transparent), radial-gradient(circle at bottom right, #f3e8ff, transparent);
        }

        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            max-width: 450px;
            width: 100%;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.4);
            text-align: center;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group { margin-bottom: 1.5rem; text-align: left; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--text-main);
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
        }

        button {
            width: 100%;
            padding: 1.2rem;
            border: none;
            background: var(--text-main);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            background: #333;
            transform: translateY(-2px);
        }
        
        .footer-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }
        .footer-link:hover { color: var(--text-main); }
        .footer-link span { font-weight: 600; color: var(--text-main); text-decoration: underline; }
        
        .btn-google:hover {
            background-color: #f7f7f7 !important;
            border-color: rgba(0,0,0,0.2) !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1) !important;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">Lumière</a>
    </nav>

    <div class="container">
        <h1 class="page-title">Welcome Back</h1>
        <p class="subtitle">Sign in to continue your curated experience.</p>

        <form action="/" method="get">
            <div class="form-group">
                <label>Email Address</label>
                <input type="text" name="username" placeholder="hello@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit">Sign In</button>
        </form>

        <!-- Google Login Button -->
        <div style="margin-top: 1.5rem; text-align: center;">
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <span style="flex-grow: 1; height: 1px; background: rgba(0,0,0,0.1);"></span>
                Or continue with
                <span style="flex-grow: 1; height: 1px; background: rgba(0,0,0,0.1);"></span>
            </p>
            <a href="/oauth2/authorization/google" class="btn-google" style="
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
                width: 100%;
                padding: 1.1rem;
                background: white;
                border: 1px solid rgba(0,0,0,0.1);
                border-radius: 12px;
                color: var(--text-main);
                font-weight: 500;
                font-size: 1rem;
                text-decoration: none;
                transition: all 0.3s ease;
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            ">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" style="width:20px;height:20px;">
                Sign In with Google
            </a>
        </div>
        
        <a href="/register" class="footer-link">Don't have an account? <span>Register here</span></a>
    </div>

</body>
</html>
